name: Windows validation

on:
  push:
    branches-ignore: ["dependabot/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            preset: windows-msvc-debug
            os: windows-2022
          - configuration: Release
            preset: windows-msvc-release
            os: windows-2022
          - configuration: Release
            preset: windows-vs2026-release
            os: windows-2025
    env:
      VCPKG_ROOT: ${{ github.workspace }}-vcpkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap pinned vcpkg registry
        shell: pwsh
        run: cmake -P scripts/bootstrap-vcpkg.cmake
      - name: Configure
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        shell: pwsh
        run: >-
          ctest --preset ${{ matrix.preset }} --timeout 120
          --output-junit "$env:GITHUB_WORKSPACE/out/windows-test-results.xml"
      - name: Package
        if: matrix.configuration == 'Release' && matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          cpack --preset windows-msvc-release
          $package = Get-ChildItem out/build/windows-msvc-release/BlackBox-*.zip |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          ./scripts/write-release-checksum.ps1 -PackagePath $package.FullName
          ./scripts/verify-release.ps1 -PackagePath $package.FullName
      - name: Upload release package
        if: matrix.configuration == 'Release' && matrix.os == 'windows-2022'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BlackBox-windows-x64
          path: |
            out/build/windows-msvc-release/BlackBox-*.zip
            out/build/windows-msvc-release/BlackBox-*.zip.sha256
      - name: Retain Windows diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BlackBox-diagnostics-windows-${{ matrix.os }}-${{ matrix.configuration }}-${{ github.sha }}
          path: |
            out/build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            out/build/${{ matrix.preset }}/Testing/Temporary/*.log
            out/windows-test-results.xml
          if-no-files-found: warn
          retention-days: 14

  headless-collection:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VCPKG_ROOT: ${{ github.workspace }}-vcpkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap pinned vcpkg registry
        shell: pwsh
        run: cmake -P scripts/bootstrap-vcpkg.cmake
      - name: Configure core collection graph
        shell: pwsh
        run: >-
          cmake -S . -B out/build/windows-headless -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DBLACKBOX_BUILD_APP=OFF -DBLACKBOX_ENABLE_STORAGE_DEPENDENCIES=OFF
          -DBLACKBOX_ENABLE_ANALYSIS=OFF -DBLACKBOX_ENABLE_AUTOMATIC_DETECTION=OFF
          -DBLACKBOX_BUILD_TESTS=ON
      - name: Build and test core collection graph
        shell: pwsh
        run: |
          cmake --build out/build/windows-headless --config Release
          ctest --test-dir out/build/windows-headless -C Release --output-on-failure

  linux-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VCPKG_ROOT: ${{ github.workspace }}-vcpkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # vcpkg detects SDL video backends when its first configure runs, so these
      # packages must exist before even the portable graph primes the cache.
      - name: Install native Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            xvfb \
            libx11-dev libxext-dev libxrandr-dev libxrender-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxcursor-dev libxinerama-dev libxkbcommon-dev \
            pkg-config libdbus-1-dev
      - name: Bootstrap pinned vcpkg registry
        shell: bash
        run: cmake -P scripts/bootstrap-vcpkg.cmake
      - name: Configure portable headless graph
        shell: bash
        run: >-
          cmake -S . -B out/build/linux-headless -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DBLACKBOX_BUILD_APP=OFF -DBLACKBOX_ENABLE_STORAGE_DEPENDENCIES=OFF
          -DBLACKBOX_ENABLE_ANALYSIS=OFF -DBLACKBOX_ENABLE_AUTOMATIC_DETECTION=OFF
          -DBLACKBOX_BUILD_TESTS=ON -DBLACKBOX_WARNINGS_AS_ERRORS=ON
      - name: Build and test portable headless graph
        shell: bash
        run: |
          cmake --build out/build/linux-headless --parallel
          ctest --test-dir out/build/linux-headless --output-on-failure
      - name: Measure native Linux provider overhead
        shell: bash
        run: |
          report="$GITHUB_WORKSPACE/out/build/linux-headless/linux-provider-overhead.ini"
          ./out/build/linux-headless/tests/blackbox_linux_provider_benchmark 32 > "$report"
          grep -Fxq "format=1" "$report"
          grep -Fxq "failed=0" "$report"
          processes="$(awk -F= '$1 == "processes_max" { print $2 }' "$report")"
          p95="$(awk -F= '$1 == "p95_us" { print $2 }' "$report")"
          maximum="$(awk -F= '$1 == "maximum_us" { print $2 }' "$report")"
          test -n "$processes" && test "$processes" -ge 1
          test -n "$p95" && test "$p95" -le 250000
          test -n "$maximum" && test "$maximum" -le 1000000
      - name: Configure native Linux desktop graph
        shell: bash
        run: >-
          cmake -S . -B out/build/linux-desktop -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DBLACKBOX_BUILD_APP=ON -DBLACKBOX_BUILD_TESTS=OFF
          -DBLACKBOX_WARNINGS_AS_ERRORS=ON
      - name: Build and smoke native Linux desktop
        shell: bash
        run: |
          cmake --build out/build/linux-desktop --target blackbox --parallel
          report="$GITHUB_WORKSPACE/out/build/linux-desktop/linux-desktop-smoke.ini"
          xvfb-run -a env SDL_VIDEODRIVER=x11 SDL_RENDER_DRIVER=software \
            ./out/build/linux-desktop/src/blackbox \
            --background-diagnostic-seconds=2 \
            --diagnostic-report="$report"
          test -f "$report"
          grep -Fxq "platform=Linux" "$report"
          grep -Fxq "completed=1" "$report"
          grep -Fxq "failed_samples=0" "$report"
          collections="$(awk -F= '$1 == "collections" { print $2 }' "$report")"
          test -n "$collections"
          test "$collections" -ge 2
      - name: Package and smoke Linux engineering preview
        shell: bash
        run: |
          cmake --build out/build/linux-desktop --target package --parallel
          package="$(find out/build/linux-desktop -maxdepth 1 -type f \
            -name 'BlackBox-*-linux-*-engineering-preview.tar.gz' -print -quit)"
          test -n "$package" && test -s "$package"
          extract="$GITHUB_WORKSPACE/out/build/linux-package-smoke"
          mkdir -p "$extract"
          tar -xzf "$package" -C "$extract"
          executable="$(find "$extract" -type f -name blackbox -perm -u+x -print -quit)"
          test -n "$executable"
          readelf -d "$executable" | grep -Fq '$ORIGIN'
          if readelf -d "$executable" | grep -Fq "$GITHUB_WORKSPACE"; then
            echo "Packaged executable retains a build-workspace runtime path" >&2
            exit 1
          fi
          report="$GITHUB_WORKSPACE/out/build/linux-package-smoke.ini"
          xvfb-run -a env SDL_VIDEODRIVER=x11 SDL_RENDER_DRIVER=software \
            "$executable" --background-diagnostic-seconds=2 \
            --diagnostic-report="$report"
          grep -Fxq "platform=Linux" "$report"
          grep -Fxq "completed=1" "$report"
          grep -Fxq "failed_samples=0" "$report"
      - name: Upload Linux engineering evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BlackBox-linux-engineering-${{ github.sha }}
          path: |
            out/build/linux-desktop/BlackBox-*-linux-*-engineering-preview.tar.gz
            out/build/linux-headless/linux-provider-overhead.ini
            out/build/linux-desktop/linux-desktop-smoke.ini
            out/build/linux-package-smoke.ini
          if-no-files-found: error

  hosted-evidence:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build-test-package, headless-collection, linux-boundary]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write revision-bound hosted success attestation
        shell: pwsh
        run: >-
          ./scripts/write-hosted-ci-attestation.ps1
          -WorkflowKey windows -OutputDirectory out/hosted-ci/windows
      - name: Upload hosted success attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BlackBox-hosted-ci-windows-${{ github.sha }}
          path: out/hosted-ci/windows
          if-no-files-found: error
