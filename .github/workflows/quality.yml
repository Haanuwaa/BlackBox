name: Quality and security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy-sbom:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}-vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}-vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore shared vcpkg binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-sbom-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare shared vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Verify immutable dependency and action policy
        shell: pwsh
        run: |
          ./scripts/verify-dependency-policy.ps1
          ./scripts/verify-quality-gates.ps1
      - name: Bootstrap pinned vcpkg registry
        shell: pwsh
        run: |
          git init "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$env:VCPKG_ROOT" fetch --depth 1 origin d015e31e90838a4c9dfa3eed45979bc70d9357fc
          git -C "$env:VCPKG_ROOT" checkout FETCH_HEAD
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      - name: Resolve pinned dependency graph
        shell: pwsh
        run: >-
          cmake -S . -B out/build/windows-quality-sbom -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DBLACKBOX_BUILD_APP=OFF -DBLACKBOX_BUILD_TESTS=OFF
      - name: Generate and validate CycloneDX SBOM
        shell: pwsh
        run: >-
          ./scripts/generate-sbom.ps1
          -StatusPath out/build/windows-quality-sbom/vcpkg_installed/vcpkg/status
          -OutputPath out/quality/blackbox.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BlackBox-CycloneDX-SBOM
          path: out/quality/blackbox.cdx.json
          if-no-files-found: error

  dependency-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Resolve exact dependency comparison revisions
        id: dependency-range
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            $base = $env:PR_BASE_SHA
          } elseif ($env:EVENT_NAME -eq 'push' -and
                    $env:EVENT_BEFORE -match '^[0-9a-f]{40}$' -and
                    $env:EVENT_BEFORE -ne ('0' * 40)) {
            $base = $env:EVENT_BEFORE
          } else {
            $base = (git rev-parse "$($env:SOURCE_SHA)^1").Trim()
          }
          if ($base -notmatch '^[0-9a-f]{40}$' -or
              $env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$' -or
              $base -eq $env:SOURCE_SHA) {
            throw 'Dependency review requires two distinct exact revisions.'
          }
          "base=$base" >> $env:GITHUB_OUTPUT
          "head=$($env:SOURCE_SHA)" >> $env:GITHUB_OUTPUT
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          base-ref: ${{ steps.dependency-range.outputs.base }}
          head-ref: ${{ steps.dependency-range.outputs.head }}

  codeql:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      packages: read
    env:
      VCPKG_ROOT: ${{ github.workspace }}-vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}-vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore CodeQL vcpkg binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-codeql-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare CodeQL vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Bootstrap pinned vcpkg registry
        shell: pwsh
        run: |
          git init "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$env:VCPKG_ROOT" fetch --depth 1 origin d015e31e90838a4c9dfa3eed45979bc70d9357fc
          git -C "$env:VCPKG_ROOT" checkout FETCH_HEAD
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      - name: Resolve production dependencies outside CodeQL tracing
        shell: pwsh
        run: >-
          cmake --preset windows-msvc-release -DBLACKBOX_BUILD_TESTS=OFF
      - name: Initialize CodeQL C++ analysis
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: c-cpp
          build-mode: manual
          # Security findings belong in the repository Security tab. Code quality is
          # enforced separately by warnings-as-errors, MSVC /analyze, sanitizers,
          # coverage, property tests, and fuzzing below. Including the broad
          # security-and-quality suite here uploads test-registration and vendored
          # header style notes as security alerts.
          queries: security-extended
      - name: Build observed production graph
        shell: pwsh
        run: |
          # Dependencies were resolved before tracing. CodeQL now observes every
          # BlackBox production translation unit and no third-party package build.
          # Tests, fixtures, and benchmarks retain their dedicated quality jobs.
          cmake --build --preset windows-msvc-release --config Release --parallel --target `
            blackbox `
            blackbox_dataset_tool `
            blackbox_soak_archive_fault `
            blackbox_dogfood_tool `
            blackbox_offline_ml_tool `
            blackbox_dogfood_capture
      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

  msvc-static-analysis:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}-vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}-vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore shared vcpkg binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-static-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare shared vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Bootstrap pinned vcpkg registry
        shell: pwsh
        run: |
          git init "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$env:VCPKG_ROOT" fetch --depth 1 origin d015e31e90838a4c9dfa3eed45979bc70d9357fc
          git -C "$env:VCPKG_ROOT" checkout FETCH_HEAD
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure MSVC native analysis
        shell: pwsh
        run: >-
          cmake -S . -B out/build/windows-static-analysis -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DBLACKBOX_ENABLE_MSVC_CODE_ANALYSIS=ON -DBLACKBOX_WARNINGS_AS_ERRORS=ON
      - name: Analyze all product and test translation units
        shell: pwsh
        run: >-
          cmake --build out/build/windows-static-analysis --config Release
          --target blackbox blackbox_tests --parallel

  windows-address-sanitizer:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}-vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}-vcpkg-binary-cache
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore shared vcpkg binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-asan-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/x64-windows-blackbox-asan.cmake') }}
          restore-keys: |
            quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare shared vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Bootstrap pinned vcpkg registry
        shell: pwsh
        run: |
          git init "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$env:VCPKG_ROOT" fetch --depth 1 origin d015e31e90838a4c9dfa3eed45979bc70d9357fc
          git -C "$env:VCPKG_ROOT" checkout FETCH_HEAD
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure AddressSanitizer graph
        shell: pwsh
        run: >-
          cmake -S . -B out/build/windows-address-sanitizer -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/cmake/triplets"
          -DVCPKG_TARGET_TRIPLET=x64-windows-blackbox-asan
          -DBLACKBOX_ENABLE_ADDRESS_SANITIZER=ON
      - name: Build instrumented product and tests
        shell: pwsh
        run: >-
          cmake --build out/build/windows-address-sanitizer --config RelWithDebInfo
          --parallel
      - name: Run instrumented suite
        shell: pwsh
        run: >-
          ctest --test-dir out/build/windows-address-sanitizer -C RelWithDebInfo
          --output-on-failure -E "Windows unhandled exception probe"

  linux-undefined-sanitizer:
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}-vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}-vcpkg-binary-cache
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore shared vcpkg binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-ubsan-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare shared vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Bootstrap pinned vcpkg registry
        shell: bash
        run: |
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin d015e31e90838a4c9dfa3eed45979bc70d9357fc
          git -C "$VCPKG_ROOT" checkout FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure UndefinedBehaviorSanitizer graph
        shell: bash
        run: >-
          CC=gcc-14 CXX=g++-14 cmake -S . -B out/build/linux-ubsan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DBLACKBOX_BUILD_APP=OFF -DBLACKBOX_ENABLE_UNDEFINED_SANITIZER=ON
          -DBLACKBOX_WARNINGS_AS_ERRORS=ON
      - name: Build and run instrumented suite
        shell: bash
        run: |
          cmake --build out/build/linux-ubsan --parallel
          ctest --test-dir out/build/linux-ubsan --output-on-failure

  linux-native-fuzz:
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}-vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}-vcpkg-binary-cache
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install portal parser dependency
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libdbus-1-dev
      - name: Restore shared vcpkg binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-fuzz-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare shared vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Bootstrap pinned vcpkg registry
        shell: bash
        run: |
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin d015e31e90838a4c9dfa3eed45979bc70d9357fc
          git -C "$VCPKG_ROOT" checkout FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure Clang libFuzzer graph
        shell: bash
        run: >-
          CC=clang-18 CXX=clang++-18 cmake -S . -B out/build/linux-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DBLACKBOX_BUILD_APP=OFF -DBLACKBOX_ENABLE_STORAGE_DEPENDENCIES=ON
          -DBLACKBOX_ENABLE_ANALYSIS=OFF -DBLACKBOX_BUILD_TESTS=ON
          -DBLACKBOX_BUILD_FUZZERS=ON -DBLACKBOX_ENABLE_ADDRESS_SANITIZER=ON
          -DCMAKE_CXX_FLAGS="-D__cpp_concepts=202002L"
      - name: Build and smoke the seed corpus
        shell: bash
        run: |
          cmake --build out/build/linux-fuzz --target \
            blackbox_settings_fuzzer blackbox_native_parser_fuzzer \
            blackbox_direct_v1_archive_fuzzer blackbox_linux_portal_message_fuzzer --parallel
          ctest --test-dir out/build/linux-fuzz --output-on-failure -L fuzz
      - name: Run bounded native fuzz campaign
        shell: bash
        run: |
          out/build/linux-fuzz/tests/blackbox_settings_fuzzer \
            -max_total_time=30 -max_len=20000 -timeout=5 -rss_limit_mb=1024 \
            out/build/linux-fuzz/tests/fuzz-corpus
          out/build/linux-fuzz/tests/blackbox_native_parser_fuzzer \
            -max_total_time=30 -max_len=65536 -timeout=5 -rss_limit_mb=1024 \
            out/build/linux-fuzz/tests/fuzz-corpus
          out/build/linux-fuzz/tests/blackbox_direct_v1_archive_fuzzer \
            -max_total_time=30 -max_len=1048576 -timeout=5 -rss_limit_mb=1024 \
            out/build/linux-fuzz/tests/fuzz-corpus
          out/build/linux-fuzz/tests/blackbox_linux_portal_message_fuzzer \
            -max_total_time=30 -max_len=4096 -timeout=5 -rss_limit_mb=1024 \
            out/build/linux-fuzz/tests/fuzz-corpus

  linux-thread-sanitizer:
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}-vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}-vcpkg-binary-cache
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore shared vcpkg binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-tsan-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare shared vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Bootstrap pinned vcpkg registry
        shell: bash
        run: |
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin d015e31e90838a4c9dfa3eed45979bc70d9357fc
          git -C "$VCPKG_ROOT" checkout FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure ThreadSanitizer graph
        shell: bash
        run: >-
          CC=gcc CXX=g++ cmake -S . -B out/build/linux-tsan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DBLACKBOX_BUILD_APP=OFF -DBLACKBOX_ENABLE_THREAD_SANITIZER=ON
          -DBLACKBOX_WARNINGS_AS_ERRORS=ON
      - name: Build instrumented concurrency graph
        shell: bash
        run: cmake --build out/build/linux-tsan --target blackbox_tests --parallel
      - name: Exercise collector, writer, viewer, and cache concurrency
        shell: bash
        run: >-
          ctest --test-dir out/build/linux-tsan --output-on-failure
          -R "collector|writer|viewer|metadata cache"

  linux-coverage:
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}-vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}-vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install desktop coverage dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config xvfb xauth dbus-x11 \
            libx11-dev libxext-dev libxrandr-dev libxrender-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxcursor-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev libsystemd-dev
      - name: Restore shared vcpkg binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-coverage-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            quality-vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare shared vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Bootstrap pinned vcpkg registry
        shell: bash
        run: |
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin d015e31e90838a4c9dfa3eed45979bc70d9357fc
          git -C "$VCPKG_ROOT" checkout FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure coverage graph
        shell: bash
        run: >-
          CC=gcc CXX=g++ cmake -S . -B out/build/linux-coverage -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DBLACKBOX_BUILD_APP=ON -DBLACKBOX_ENABLE_COVERAGE=ON
      - name: Build and run coverage suite
        shell: bash
        run: |
          cmake --build out/build/linux-coverage --parallel
          xvfb-run -a dbus-run-session -- \
            ctest --test-dir out/build/linux-coverage --output-on-failure
          mkdir -p out/quality/coverage-runtime/config out/quality/coverage-runtime/data
          report="$PWD/out/quality/coverage-runtime/visible.ini"
          XDG_CONFIG_HOME="$PWD/out/quality/coverage-runtime/config" \
          XDG_DATA_HOME="$PWD/out/quality/coverage-runtime/data" \
            xvfb-run -a dbus-run-session -- env SDL_VIDEODRIVER=x11 SDL_RENDER_DRIVER=software \
            timeout 20s out/build/linux-coverage/src/blackbox \
              --visible-diagnostic-seconds=5 --diagnostic-report="$report"
      - name: Generate bounded coverage report
        shell: bash
        run: |
          mkdir -p out/quality
          python3 -m pip install --disable-pip-version-check gcovr==8.6
          python3 -m gcovr --root . --filter 'src/' --exclude 'src/platform/windows/' \
            --exclude 'src/telemetry/windows/' --exclude 'src/app/' --exclude 'src/ui/' \
            --html-details out/quality/coverage.html \
            --xml-pretty --xml out/quality/coverage.xml --print-summary \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --fail-under-line 60 --fail-under-branch 45
          for component in core telemetry storage analysis; do
            python3 -m gcovr --root . --filter "src/$component/" --print-summary \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --fail-under-line 45 --fail-under-branch 30
          done
          for component in app ui; do
            python3 -m gcovr --root . --filter "src/$component/" --print-summary \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --fail-under-line 15 --fail-under-branch 10
          done
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BlackBox-coverage
          path: |
            out/quality/coverage.html
            out/quality/coverage*.html
            out/quality/coverage.xml
          if-no-files-found: error

  hosted-evidence:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - dependency-policy-sbom
      - dependency-review
      - codeql
      - msvc-static-analysis
      - windows-address-sanitizer
      - linux-undefined-sanitizer
      - linux-native-fuzz
      - linux-thread-sanitizer
      - linux-coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write revision-bound hosted success attestation
        shell: pwsh
        run: >-
          ./scripts/write-hosted-ci-attestation.ps1
          -WorkflowKey quality -OutputDirectory out/hosted-ci/quality
      - name: Upload hosted success attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BlackBox-hosted-ci-quality-${{ github.sha }}
          path: out/hosted-ci/quality
          if-no-files-found: error
